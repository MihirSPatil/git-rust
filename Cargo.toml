[package]
name = "git-rust"
version = "0.1.0"
authors = ["Mihir S. Patil"]
description = "From-scratch Git client in Rust implementing SHA-1 object storage, Smart HTTP packfiles, and binary delta patching (credit to CodeCrafters)."
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "git-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.68"                                         # ergonomic error handling with context
bytes = "1.3.0"                                           # byte buffer utilities
flate2 = "1.0.34"                                         # zlib compression and decompression
thiserror = "1.0.38"                                      # structured error definitions
sha1 = "0.10.0"                                           # SHA-1 object hashing
hex = "0.4"                                               # hex encoding/decoding for 20-byte SHAs
reqwest = { version = "0.13.5", features = ["blocking"] } # synchronous HTTP client for Smart Protocol
